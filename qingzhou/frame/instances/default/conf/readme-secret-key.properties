global=平台全局对称密钥，用于加解密数据库密码、模型密钥等敏感配置，留空时首次使用自动生成并回写本文件
agent-domain~default=agent 域根密钥，格式为 agent-domain~域名 加 Base64 编码的字节密钥；域名即本实例身份，agent 与注册中心两侧配同一条，带外分发、永不上网
# agent-domain~ 密钥是所在域的信任根：同域任一成员持该密钥即可注册伪实例、解密其它实例首注册报文（含 instanceSecret）
# 并冒充注册中心驱动该 agent；权限模型仅在注册中心侧，agent 侧 /invoke、/upload 只校验是否持有每实例密码器。
# 故域密钥须 >=16 字节随机、带外分发、永不上网，且 agent 与注册中心之间必须使用经验证的 TLS（勿开 allow_ssl_trust_all=true）。
