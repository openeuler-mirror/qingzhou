# jvm args
jvm.arg=本实例的 JVM 启动参数，按空白拆分后追加到 java 命令行，含 shell 元字符的参数会被丢弃
jvm.arg.allowed=逗号分隔的参数前缀白名单，仅用于放行默认禁止的 -agentlib、-javaagent、-agentpath、-Xrun 四类参数

# http
qingzhou-http-server.host=HTTP 服务监听地址，默认 127.0.0.1；非环回地址且关闭 TLS 时必须同时开启 allow_plaintext
qingzhou-http-server.port=HTTP 服务监听端口，0 表示由操作系统随机分配
qingzhou-http-server.ssl_enabled=是否启用 HTTPS，默认 true，启用时须配置可用的密钥库
qingzhou-http-server.ssl_keystore_path=密钥库文件路径，相对实例目录，可用 qingzhou.sh keystore 命令生成
qingzhou-http-server.ssl_keystore_password=密钥库口令，plain: 前缀表示明文，否则按密文解密
qingzhou-http-server.ssl_keystore_type=密钥库类型，仅支持 PKCS12 或 JKS，默认 PKCS12
qingzhou-http-server.auth_fail_max=同一来源 IP 在窗口期内认证失败次数上限，达到后直接返回 401，默认 10
qingzhou-http-server.auth_fail_window=认证失败计数窗口，单位秒，默认 60
qingzhou-http-server.idle_timeout=连接空闲超时，单位秒，0 表示不超时，默认 60
qingzhou-http-server.request_timeout_seconds=从请求准入到请求体读完的超时，单位秒，0 表示不限，默认 10
qingzhou-http-server.max_keep_alive_requests=单条长连接最多处理的请求数，默认 100
qingzhou-http-server.selector=网络接入线程数，默认 1
qingzhou-http-server.worker=业务处理线程数，默认 CPU 核数的 2 倍
qingzhou-http-server.max_body_bytes=单个请求体缓存在内存中的字节上限，超出返回 413，默认 8MB，且不得大于 max_aggregated_bytes
qingzhou-http-server.max_stream_bytes=流式上传（含 multipart）请求体总量上限，超出返回 413，默认 256MB
qingzhou-http-server.max_connections=最大并发连接数，0 表示不限，默认 10000
qingzhou-http-server.hsts_preload=HTTPS 响应是否在 HSTS 头中附加 preload 标记，默认 false
qingzhou-http-server.allow_plaintext=是否允许非环回地址以明文 HTTP 监听，仅供可信 TLS 反向代理场景，默认 false
qingzhou-http-server.max_aggregated_bytes=所有在途请求体缓存总字节上限，超出返回 503，默认 64MB
qingzhou-http-server.max_concurrent_requests=在途请求并发上限，超出返回 503，默认 1000
qingzhou-http-server.max_concurrent_streams=流式上传并发上限，默认 64
qingzhou-http-server.max_concurrent_per_source=单个来源 IP 的在途请求并发上限，0 表示不限制，默认 64
qingzhou-http-server.max_tracked_sources=逐源限流跟踪的来源数上限，默认 10000
qingzhou-http-server.hsts_max_age=HSTS 响应头的 max-age，单位秒，默认 31536000
qingzhou-http-server.ssl_key_password=密钥库 key 口令，缺省与 ssl_keystore_password 一致，plain: 前缀表示明文
qingzhou-http-server.permissions_policy=Permissions-Policy 响应头取值，为空则不下发该头
qingzhou-http-server.csp=Content-Security-Policy 响应头取值，为空或 none 表示不下发该头
qingzhou-http-server.coop=Cross-Origin-Opener-Policy 响应头取值，为空则不下发该头
qingzhou-http-server.corp=Cross-Origin-Resource-Policy 响应头取值，为空则不下发该头
qingzhou-http-server.cors_allowed_origins=跨域来源白名单，逗号分隔，为空表示不开放跨域，星号表示放开全部

# http-client
qingzhou-http-client.allow_ssl_trust_all=是否信任所有 TLS 证书且跳过主机名校验，默认 false；仅受控环境使用，置 true 时注册中心到 agent 链路可被中间人攻击

# auth
qingzhou-auth.username=管理员登录用户名，启动前必须配置
qingzhou-auth.password=管理员登录密码的摘要值而非明文，由 init 命令生成或用 auth-password 命令生成
qingzhou-auth.roles=管理员角色列表，逗号分隔
qingzhou-auth.totp_enabled=是否开启登录双因子校验，默认 false
qingzhou-auth.totp_secret=双因子校验使用的 TOTP 密钥，plain: 前缀表示明文，开启双因子时必填
qingzhou-auth.max_failures=同一 IP 加同一用户名的登录失败次数上限，超出锁定并返回 429，默认 5
qingzhou-auth.lock_seconds=登录失败锁定时长，单位秒，默认 300
qingzhou-auth.token_expire_seconds=登录令牌有效期，单位秒，同时作为 Cookie 的 Max-Age，默认 1800
qingzhou-auth.cookie_secure=登录 Cookie 是否带 Secure 标记，取值 true、false 或 auto，默认 auto 表示按请求协议自动判断
qingzhou-auth.cookie_samesite=登录 Cookie 的 SameSite 取值，可选 Lax、Strict、None，默认 Strict
qingzhou-auth.oauth2_enabled=是否开启 OAuth2 单点登录，关闭时 /oauth2 相关接口返回 404，默认 false
qingzhou-auth.oauth2_authorize_endpoint=OAuth2 授权端点地址，开启后必填
qingzhou-auth.oauth2_token_endpoint=OAuth2 用授权码换取访问令牌的端点地址，开启后必填
qingzhou-auth.oauth2_userinfo_endpoint=OAuth2 获取用户身份的端点地址，开启后必填
qingzhou-auth.oauth2_scope=OAuth2 授权请求的 scope 取值，为空则不带该参数
qingzhou-auth.oauth2_client_id=OAuth2 客户端标识，开启后必填
qingzhou-auth.oauth2_client_secret=OAuth2 客户端密钥，plain: 前缀表示明文，开启后必填
qingzhou-auth.oauth2_this_server=本服务对外访问基址，用于拼接回调地址 /oauth2/callback，开启后必填
qingzhou-auth.oauth2_userinfo_username_field=从用户信息响应中取用户名的字段名，为空时依次回退 preferred_username、name、sub
qingzhou-auth.oauth2_roles=OAuth2 登录用户授予的角色列表，逗号分隔，为空表示不授予任何角色

# registry
qingzhou-registry.interval=注册中心检测远端实例状态的周期，单位秒，默认 6
qingzhou-registry.timeout=远端实例失联判定阈值，单位秒，默认 12，应明显大于 agent 的心跳周期
qingzhou-registry.trust_advertised_host=是否采信 agent 自报的对外地址，默认 false；仅反代/NAT 部署开启，开启后持域密钥者可把注册中心流量导向任意内网 host:port（SSRF），谨慎启用

# agent
qingzhou-agent.url=注册中心访问地址，尾部拼上 /registry/register 作为注册接口，启用 agent 时必填
qingzhou-agent.advertised_host=反代/NAT 下本实例的对外可达地址，留空则由注册中心按连接源地址推断；需注册中心同时开启 trust_advertised_host 才生效
qingzhou-agent.interval=向注册中心发送心跳的周期，单位秒，默认 6

# logger
qingzhou-logger.writingthread=是否启用异步写日志线程，启用后日志先入队列批量落盘
qingzhou-logger.writer_console=控制台日志输出器定义，取值为 console 或输出器实现类名
qingzhou-logger.writer_console.level=控制台日志的最低输出级别
qingzhou-logger.writer_console.format=控制台日志输出格式模板，{date}、{level}、{message} 为占位符
qingzhou-logger.writer_file=文件日志输出器定义，取值为 rolling file 或输出器实现类名
qingzhou-logger.writer_file.file=日志文件路径模板，相对实例目录，{date:格式} 与 {count} 在滚动时填充
qingzhou-logger.writer_file.level=文件日志的最低输出级别
qingzhou-logger.writer_file.format=文件日志输出格式模板，{date}、{level}、{message} 为占位符
qingzhou-logger.writer_file.policies=日志滚动策略，逗号分隔，如 size: 50MB,daily 表示按大小或按天滚动
qingzhou-logger.writer_file.backups=历史日志文件保留份数，超出后删除最旧的
qingzhou-logger.writer_file.latest=额外维护的最新日志副本路径，为空则不生成
qingzhou-logger.writer_file.buffered=是否缓冲写入日志文件
qingzhou-logger.writer_file.charset=日志文件字符集
qingzhou-logger.writer_file.convert=滚动后历史日志的压缩方式，如 gzip，为空则不压缩

# jdbc
qingzhou-jdbc~h2.url=数据源连接地址，h2 为数据源名称，应用按名称获取该数据源
qingzhou-jdbc~h2.username=数据源用户名
qingzhou-jdbc~h2.password=数据源密码，支持填写加密后的密文
qingzhou-jdbc~h2.maxActive=连接池最大活跃连接数，空闲连接数自动与之一致
qingzhou-jdbc~h2.testWhileIdle=是否由空闲检测线程校验空闲连接是否可用

# llm
qingzhou-llm.base_url=兼容 OpenAI 的对话补全接口完整地址，启用大模型时必填
qingzhou-llm.api_key=调用大模型接口的密钥，支持填写加密后的密文，启用大模型时必填
qingzhou-llm.model=请求中使用的模型名称，启用大模型时必填

# ai
qingzhou-ai.memory_store=会话记忆的存储方式，file 表示文件存储，其他值表示内存存储
qingzhou-ai.memory_store_dir=文件存储模式的会话目录，相对实例目录，仅 file 方式生效
qingzhou-ai.memory_max_bytes=会话数据总量上限，单位字节，超出时先淘汰归档会话，默认 200MB
qingzhou-ai.memory_max_conversations=活跃会话总数上限，默认 1000
qingzhou-ai.memory_max_conversations_per_user=单个用户活跃会话数上限，默认 50
qingzhou-ai.memory_max_conversations_anonymous=匿名用户活跃会话数上限，默认 20
qingzhou-ai.memory_max_archived=归档会话数量上限，仅保留标题与摘要，默认 2000
qingzhou-ai.message_max_chars=单条消息入库前的字符数上限，超出截断，默认 8000
qingzhou-ai.summary_max_chars=会话摘要的最大字符数，默认 2000
qingzhou-ai.conversation_soft_messages=单会话消息条数达到该值即触发异步压缩，默认 80
qingzhou-ai.conversation_hard_messages=单会话消息条数硬上限，超出强制丢弃最旧消息，默认 150
qingzhou-ai.conversation_keep_messages=压缩时保留的最近消息条数，不得大于 soft 值，默认 80
qingzhou-ai.compaction_input_max_chars=单次摘要请求的输入字符数上限，默认 24000
qingzhou-ai.history_total_budget=注入模型的历史上下文总字符预算，默认 20000
qingzhou-ai.history_output_reserve=为模型输出预留的字符数，0 表示不预留，默认 4000
qingzhou-ai.history_min_chars=历史上下文预算下限，默认 2000
qingzhou-ai.history_max_messages=注入模型的历史消息条数上限，至少按 2 生效，默认 20

# config
qingzhou-config.remote.enabled=是否启用远程配置中心，启用后远程配置覆盖同名本地配置
qingzhou-config.remote.type=远程配置中心类型，目前仅支持 etcd
qingzhou-config.remote.endpoints=远程配置中心地址列表，逗号分隔，启用时必填
qingzhou-config.remote.namespace=配置命名空间，作为远端配置的键前缀，启用时必填
qingzhou-config.remote.username=远程配置中心认证用户名，可选
qingzhou-config.remote.password=远程配置中心认证密码，可选
qingzhou-config.remote.connect_timeout=连接远程配置中心的超时，单位秒，默认 3
qingzhou-config.remote.read_timeout=读取远程配置的超时，单位秒，默认 5

# app~
app~qingzhou-app-demo.code=向符号名为 qingzhou-app-demo 的应用注入名为 code 的自定义配置项
