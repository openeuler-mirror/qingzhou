# jvm args
jvm.arg=\
  -DQingzhou-Detection-Scan-Roots=user.home,/usr/local,/opt,/opt/homebrew/opt \
  -Dqingzhou.features.disabled= \
  -Dqingzhou.osgi.packages.import.system=com.sun.management,sun.misc \
  -Dqingzhou.osgi.packages.import.app=qingzhou.logger,qingzhou.json,qingzhou.xml,qingzhou.crypto,qingzhou.http.client,\
  qingzhou.jdbc,qingzhou.image,qingzhou.store,qingzhou.llm,qingzhou.llm.openai,\
  javax.sql,javax.naming,javax.management \
#  -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:7979 \
  -server -Xms128m -Xmx512m \
  -XX:+UseParallelGC
#jvm.arg.allowed=-agentlib:

# app ~ qingzhou-app-demo
#app~qingzhou-app-demo.code=test

# http-server
qingzhou-http-server.host=127.0.0.1
qingzhou-http-server.port=7900
qingzhou-http-server.ssl_enabled=false
qingzhou-http-server.ssl_keystore_path=conf/keystore.p12
qingzhou-http-server.ssl_keystore_password=
qingzhou-http-server.ssl_keystore_type=PKCS12
