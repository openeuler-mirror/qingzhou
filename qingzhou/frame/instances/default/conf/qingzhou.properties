#qingzhou-jdbc~h2.maxActive=20
#qingzhou-jdbc~h2.testWhileIdle=true

# ai
# 会话记忆存储方式：memory（仅内存，重启清空）/ file（落盘持久化，重启不丢）
qingzhou-ai.memory_store=memory

