# logger
qingzhou-logger~default.writingthread=true
qingzhou-logger~default.writer_console=console
qingzhou-logger~default.writer_console.level=info
qingzhou-logger~default.writer_console.format={date} [{level}] {message}
qingzhou-logger~default.writer_file=rolling file
qingzhou-logger~default.writer_file.file=logs/server/server_{date:yyyy-MM-dd}_{count}.log
qingzhou-logger~default.writer_file.level=info
qingzhou-logger~default.writer_file.format={date} [{level}] {message}
qingzhou-logger~default.writer_file.policies=size: 50MB,daily
qingzhou-logger~default.writer_file.backups=50
qingzhou-logger~default.writer_file.latest=logs/server/server.log
qingzhou-logger~default.writer_file.buffered=true
qingzhou-logger~default.writer_file.charset=UTF-8
qingzhou-logger~default.writer_file.convert=gzip
# logger ~ 应用日志
qingzhou-logger~app_default.writer_console=console
qingzhou-logger~app_default.writer_console.level=info
qingzhou-logger~app_default.writer_console.format={date} [{level}] {message}
qingzhou-logger~app_default.writer_file=rolling file
qingzhou-logger~app_default.writer_file.file=logs/app/app_{date:yyyy-MM-dd}_{count}.log
qingzhou-logger~app_default.writer_file.level=info
qingzhou-logger~app_default.writer_file.format={date} [{level}] {message}
qingzhou-logger~app_default.writer_file.policies=size: 50MB,daily
qingzhou-logger~app_default.writer_file.backups=50
qingzhou-logger~app_default.writer_file.latest=logs/app/app.log
qingzhou-logger~app_default.writer_file.buffered=true
qingzhou-logger~app_default.writer_file.charset=UTF-8
qingzhou-logger~app_default.writer_file.convert=gzip

# crypto
qingzhou-crypto.global_cipher_key_name=global

# http-client
qingzhou-http-client.allow_ssl_trust_all=false

