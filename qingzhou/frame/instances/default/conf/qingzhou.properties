# jvm args
jvm.arg=\
  -Dqingzhou.features.disabled=qingzhou-agent,qingzhou-jdbc \
  -DQingzhou-Detection-Scan-Roots=user.home,/usr/local,/opt,/opt/homebrew/opt \
  -Dqingzhou.osgi.packages.import.system=com.sun.management,sun.misc \
  -Dqingzhou.osgi.packages.import.app=qingzhou.logger,qingzhou.json,qingzhou.xml,qingzhou.crypto,qingzhou.http.client,qingzhou.image,\
  qingzhou.jdbc,qingzhou.http.server,qingzhou.llm,qingzhou.llm.openai,\
  javax.naming,javax.management \
  -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:7979 \
  -server -Xms128m -Xmx512m \
  -XX:+UseParallelGC

# app~
#app~qingzhou-app-....code=prefix

# http
# 私钥不随包分发：首次部署请执行 bin/gen-keystore.sh 生成密钥库与随机口令
qingzhou-http-server.port=7900
qingzhou-http-server.ssl_enabled=true
qingzhou-http-server.ssl_keystore_path=conf/keystore.p12
qingzhou-http-server.ssl_keystore_password=
qingzhou-http-server.ssl_keystore_type=PKCS12

# qingzhou-auth
# password 为口令摘要，不得使用随包示例值，否则任何人都能登录。执行 bin/gen-auth-password.sh 生成密码
qingzhou-auth.username=admin
qingzhou-auth.password=
#qingzhou-auth.totp_enabled=false
# totp_secret 为密文，须用本实例全局密钥加密后填入，禁止使用任何公开示例值
#qingzhou-auth.totp_secret=

# qingzhou-oauth2
#qingzhou-oauth2.authorize_endpoint=https://.../oauth/authorize
#qingzhou-oauth2.token_endpoint=https://.../oauth/token
#qingzhou-oauth2.userinfo_endpoint=https://.../oauth/userinfo
#qingzhou-oauth2.scope=openid profile
#qingzhou-oauth2.client_id=
#qingzhou-oauth2.client_secret=
#qingzhou-oauth2.redirect_uri=https://127.0.0.1:7900

# registry
# 密钥对不得使用随包示例值：执行 bin/gen-pair-key.sh 生成，私钥填此处，公钥填下方 agent 的 public_key
qingzhou-registry.private_key=
qingzhou-registry.interval=6
qingzhou-registry.timeout=12

# agent
#qingzhou-agent.url=https://localhost:7900
#qingzhou-agent.public_key=
#qingzhou-agent.interval=6

# logger
qingzhou-logger.writingthread=true
qingzhou-logger.writer_console=console
qingzhou-logger.writer_console.level=info
qingzhou-logger.writer_console.format={date} [{level}] {message}
qingzhou-logger.writer_file=rolling file
qingzhou-logger.writer_file.file=logs/server_{date:yyyy-MM-dd}_{count}.log
qingzhou-logger.writer_file.level=info
qingzhou-logger.writer_file.format={date} [{level}] {message}
qingzhou-logger.writer_file.policies=size: 50MB,daily
qingzhou-logger.writer_file.backups=50
qingzhou-logger.writer_file.latest=logs/server.log
qingzhou-logger.writer_file.buffered=true
qingzhou-logger.writer_file.charset=UTF-8
qingzhou-logger.writer_file.convert=gzip

# jdbc
#qingzhou-jdbc~h2.url=jdbc:h2:mem:testdb;DATABASE_TO_LOWER=TRUE;IGNORECASE=TRUE
#qingzhou-jdbc~h2.username=sa
#qingzhou-jdbc~h2.password=
